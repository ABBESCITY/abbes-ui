name: Bug report
description: Report a bug or unexpected behavior
title: "[bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of Abbes UI are you using?
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does this issue affect?
      options:
        - react
        - theme
        - token
        - playground / docs
        - other
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      description: Which rendering environment reproduces the issue?
      options:
        - React
        - Next.js
        - Vite
        - Other
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug.
      placeholder: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or screenshots if possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and other environment details.
      placeholder: |
        Browser: Chrome 120 / Safari 17
        OS: macOS 14
        Package manager: pnpm 9
    validations:
      required: false