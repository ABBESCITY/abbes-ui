name: Feature request
description: Suggest a new feature or improvement
title: "[feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe what you would like added.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does this feature belong to?
      options:
        - react
        - theme
        - token
        - playground / docs
        - other
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or pain point does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature and how you think it should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions or workarounds you considered?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, mockups, or any other context.
    validations:
      required: false